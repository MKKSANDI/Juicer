<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Juicer macOS battery drain utility</title>
<desc id="desc">A polished app mockup showing battery percentage, target, power modes, and live load stats.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#18191F"/><stop offset="1" stop-color="#2C1B18"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB000"/><stop offset="0.55" stop-color="#FF6B1A"/><stop offset="1" stop-color="#EA2F2F"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2D3038"/><stop offset="1" stop-color="#202229"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1280" height="720" rx="40" fill="url(#bg)"/>
<g filter="url(#shadow)">
  <rect x="110" y="74" width="1060" height="572" rx="34" fill="#15171D" stroke="#3B3F49"/>
  <rect x="110" y="74" width="1060" height="64" rx="34" fill="#222631"/>
  <circle cx="148" cy="107" r="8" fill="#FF5F57"/><circle cx="176" cy="107" r="8" fill="#FFBD2E"/><circle cx="204" cy="107" r="8" fill="#28C840"/>
  <text x="640" y="116" fill="#F4F4F5" font-family="Inter, SF Pro Display, Arial" font-size="22" font-weight="700" text-anchor="middle">Juicer</text>
  <text x="164" y="206" fill="#F7F7F8" font-family="Inter, SF Pro Display, Arial" font-size="48" font-weight="800">Controlled battery drain</text>
  <text x="166" y="250" fill="#B9C0CA" font-family="Inter, SF Pro Text, Arial" font-size="22">Bounded CPU, graphics, brightness, and temp disk load.</text>
  <rect x="166" y="302" width="322" height="222" rx="26" fill="url(#panel)" stroke="#3B3F49"/>
  <text x="327" y="356" fill="#B9C0CA" font-family="Inter, Arial" font-size="20" text-anchor="middle">Current Battery</text>
  <text x="327" y="430" fill="#FFB000" font-family="Inter, Arial" font-size="78" font-weight="800" text-anchor="middle">74%</text>
  <rect x="248" y="458" width="158" height="42" rx="10" stroke="#FFB000" stroke-width="5"/><rect x="408" y="471" width="16" height="16" rx="3" fill="#FFB000"/><rect x="260" y="470" width="105" height="18" rx="5" fill="url(#hot)"/>
  <rect x="526" y="302" width="260" height="222" rx="26" fill="url(#panel)" stroke="#3B3F49"/>
  <text x="656" y="356" fill="#B9C0CA" font-family="Inter, Arial" font-size="20" text-anchor="middle">Power Mode</text>
  <rect x="560" y="384" width="192" height="46" rx="23" fill="#333843"/><rect x="642" y="388" width="106" height="38" rx="19" fill="url(#hot)"/>
  <text x="604" y="414" fill="#C9D0DA" font-family="Inter, Arial" font-size="17" font-weight="700" text-anchor="middle">Strong</text>
  <text x="695" y="414" fill="#20150D" font-family="Inter, Arial" font-size="17" font-weight="800" text-anchor="middle">Turbo</text>
  <text x="656" y="472" fill="#F4F4F5" font-family="Inter, Arial" font-size="25" font-weight="800" text-anchor="middle">CPU + Graphics</text>
  <rect x="824" y="302" width="242" height="222" rx="26" fill="url(#panel)" stroke="#3B3F49"/>
  <text x="945" y="356" fill="#B9C0CA" font-family="Inter, Arial" font-size="20" text-anchor="middle">Live Load</text>
  <path d="M866 466C894 398 924 505 956 430C984 364 1011 424 1024 392" stroke="#FFB000" stroke-width="8" stroke-linecap="round"/>
  <text x="945" y="506" fill="#F4F4F5" font-family="Inter, Arial" font-size="26" font-weight="800" text-anchor="middle">8.9M ops/s</text>
  <rect x="166" y="560" width="900" height="22" rx="11" fill="#343946"/><rect x="166" y="560" width="690" height="22" rx="11" fill="url(#hot)"/>
  <text x="166" y="614" fill="#B9C0CA" font-family="Inter, Arial" font-size="20">Auto-stops at target and restores brightness when finished.</text>
</g>
</svg>
